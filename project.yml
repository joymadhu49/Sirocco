name: Sirocco
options:
  bundleIdPrefix: com.joymadhu
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: CJZMYQN8V6
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    # Apple silicon only. Intel Macs drive their fans through different SMC keys ("FS! "
    # instead of the Ftst unlock), which this app does not implement.
    ARCHS: arm64
packages:
  # Auto-updates. Pinned exactly: the generated project is not committed, so there is no
  # Package.resolved to hold the version still between builds.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  # The root daemon. Embedded in the app at Contents/MacOS and started by launchd through
  # SMAppService, so updating the app updates the helper with it.
  SiroccoHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/Helper
      - Sources/Shared
    settings:
      base:
        PRODUCT_NAME: SiroccoHelper
        SKIP_INSTALL: YES
  Sirocco:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
      - target: SiroccoHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    sources:
      - Sources/App
      - Sources/Shared
      # Referenced as a file, not a folder: a folder reference would land in Resources/Resources.
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # SMAppService.daemon(plistName:) looks for the plist here and nowhere else.
      - path: Resources/com.joymadhu.sirocco.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Info.plist
      properties:
        CFBundleName: Sirocco
        CFBundleDisplayName: Sirocco
        CFBundleIdentifier: com.joymadhu.Sirocco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle decides "is this newer" on CFBundleVersion, so it follows the marketing version.
        CFBundleVersion: $(MARKETING_VERSION)
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: Copyright 2026 Joy Madhu. All rights reserved.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Sparkle. The feed is the appcast.xml attached to whichever GitHub release is newest,
        # so publishing a release is what publishes the update. Archives are verified against
        # this EdDSA key; the private half stays in the maintainer's login keychain.
        SUFeedURL: https://github.com/joymadhu49/Sirocco/releases/latest/download/appcast.xml
        SUPublicEDKey: ajoIDYdrCj59w5c+p+BO7MKoJ8JmwOAeoxDt/YrwuKA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
