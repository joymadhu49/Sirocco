version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ["*"]
    # Major versions (a new TypeScript or ESLint) can break the build, so those are done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
